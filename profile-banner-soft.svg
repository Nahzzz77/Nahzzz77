<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Zhang Han — AI Product Manager</title>
  <desc id="desc">A soft editorial banner introducing Zhang Han and his focus on clear, useful and trustworthy AI products.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ee"/>
      <stop offset="0.52" stop-color="#efe9e2"/>
      <stop offset="1" stop-color="#e9eef0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f5363"/>
      <stop offset="0.55" stop-color="#657c89"/>
      <stop offset="1" stop-color="#a75d36"/>
    </linearGradient>
    <filter id="soften">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#paper)"/>
  <circle cx="1040" cy="26" r="126" fill="#d5c2b3" opacity="0.52" filter="url(#soften)"/>
  <circle cx="1120" cy="228" r="118" fill="#b9c7cd" opacity="0.42" filter="url(#soften)"/>
  <circle cx="858" cy="278" r="100" fill="#d6a07f" opacity="0.28" filter="url(#soften)"/>
  <path d="M0 248C220 208 340 270 540 236S850 164 1200 220" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.72"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="66" y="56" fill="#3f5363" font-size="16" font-weight="600" letter-spacing="2">HELLO / 你好</text>
    <text x="62" y="139" fill="#222427" font-size="58" font-weight="700" letter-spacing="1">ZHANG HAN</text>
    <text x="65" y="181" fill="#6b6864" font-size="21">张涵 · AI PRODUCT MANAGER</text>
    <rect x="65" y="211" width="72" height="5" rx="3" fill="url(#accent)"/>
  </g>

  <g transform="translate(722 78)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" fill="#6b6864" font-size="15" letter-spacing="2">MY PRODUCT BELIEF</text>
    <text x="0" y="52" fill="#222427" font-size="26" font-weight="600">Make complex systems</text>
    <text x="0" y="88" fill="#222427" font-size="26" font-weight="600">feel simple to use.</text>
    <text x="0" y="138" fill="#7b7772" font-size="15" letter-spacing="1.5">USER · PRODUCT · EVIDENCE</text>
  </g>
</svg>
